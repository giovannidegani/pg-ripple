name: OA fork image (ghcr.io/overachiever-eu)
on:
  push:
    branches: [main]
    paths: ["src/**", "sql/**", "Cargo.toml", "Cargo.lock", "pg_ripple.control", "docker/Dockerfile.overlay"]
  workflow_dispatch:
    inputs:
      base:
        description: "Base image for the overlay (pin by digest)"
        default: "ghcr.io/overachiever-eu/pg-ripple:dev"
permissions:
  contents: read
  packages: write
jobs:
  image:
    if: github.repository_owner == 'overachiever-eu'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push overlay
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          file: docker/Dockerfile.overlay
          build-args: BASE=${{ inputs.base || 'ghcr.io/overachiever-eu/pg-ripple:dev' }}
          push: true
          tags: |
            ghcr.io/overachiever-eu/pg-ripple:dev
            ghcr.io/overachiever-eu/pg-ripple:sha-${{ github.sha }}
      - run: echo "digest ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
